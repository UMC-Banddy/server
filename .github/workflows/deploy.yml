name: CI/CD Deploy

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant permission to Gradle
        run: chmod +x ./gradlew

      - name: Stop Gradle daemon and clear caches
        run: |
          ./gradlew --stop || true
          rm -rf $HOME/.gradle/caches
          rm -rf $HOME/.gradle/daemon
          rm -rf $HOME/.gradle/native
          rm -rf .gradle
          rm -rf **/build
          echo "Gradle daemon stopped and caches cleared"

      - name: Build with Gradle (no cache)
        run: ./gradlew clean bootJar --no-build-cache --refresh-dependencies --stacktrace

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/banddy:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/banddy:latest

      - name: Deploy to EC2 and run deploy.sh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}
            sudo docker-compose pull
            sudo bash deploy.sh
